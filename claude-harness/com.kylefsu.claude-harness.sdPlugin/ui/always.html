<!doctype html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Save rule">
			<sdpi-checkbox setting="sessionOnly" label="For this session only"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="">
			<p style="color:#9a9aa6;font-size:9pt;margin:0">
				Otherwise the rule goes to the project's .claude/settings.local.json, like the terminal's "don't ask
				again". Never to your user settings.
			</p>
		</sdpi-item>
		<sdpi-item label="Hold prompts">
			<sdpi-select setting="holdSeconds" global default="15">
				<option value="0">Off: answer in the terminal</option>
				<option value="10">10 seconds for the deck</option>
				<option value="15">15 seconds for the deck</option>
				<option value="30">30 seconds for the deck</option>
				<option value="60">1 minute for the deck</option>
				<option value="300">5 minutes for the deck</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
